<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <div class="outer">
        <div class="left">
            <img src="https://cdn.vectorstock.com/i/500p/82/47/login-form-interface-vector-54318247.jpg" alt="img">
        </div>
        <div class="right">
            <h2>Login</h2>
            <form action="">
                <div class="input-box">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Username" required>
                </div>
                <div class="input-box">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
            
                <button id="sub" type="submit">Login</button>
                <div class="remember-forgot">
                    <a href="#">Forgot Password?</a>
                </div>
                <div class="register-link">
                    <p>Don't have an account? <a href="#">Register</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
<script>
    const form = document.querySelector('form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    form.addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent form submission

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        if (username === '' || password === '') {
            alert('Please fill in both fields.');
            return;
        }

        // Perform login logic here (e.g., send data to server)
        console.log('Username:', username);
        console.log('Password:', password);

        // Clear the input fields after submission
        usernameInput.value = '';
        passwordInput.value = '';
        alert('Login successful!'); // You can replace this with actual login logic
    });
</script>
</html>
